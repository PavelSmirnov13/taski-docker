volumes:
  pg_data:
  static:

networks:
  taski_network:
    driver: bridge

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - taski_network
  backend:
    build: ./backend/
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
    networks:
      - taski_network
  frontend:
    env_file: .env
    build: ./frontend/
    volumes:
      - static:/frontend_static
    command: cp -r /app/build/. /frontend_static/
    networks:
      - taski_network
  gateway:
    build: ./gateway/
    ports:
      - 8000:80
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/staticfiles/
    networks:
      - taski_network
